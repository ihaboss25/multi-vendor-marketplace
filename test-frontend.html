<!DOCTYPE html>
<html>
<head>
    <title>Test Frontend to Backend</title>
</head>
<body>
    <h2>Test API Connection from Browser</h2>
    <button onclick="testRegister()">Test Register API</button>
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>
    
    <script>
    async function testRegister() {
        const data = {
            name: "Browser Test User",
            email: "browser@" + Date.now() + ".com",
            password: "password123",
            role: "buyer"
        };
        
        try {
            const response = await fetch('http://localhost:5000/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            document.getElementById('result').innerHTML = 
                `<h3>Success!</h3><pre>${JSON.stringify(result, null, 2)}</pre>`;
        } catch (error) {
            document.getElementById('result').innerHTML = 
                `<h3>Error:</h3><p>${error.message}</p>`;
        }
    }
    </script>
</body>
</html>
